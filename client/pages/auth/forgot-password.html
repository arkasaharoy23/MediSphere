<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password — MediSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../../public/assets/images/logo.svg">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/pages/auth.css">
</head>
<body>

<a href="login.html" class="auth-back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6L5 12L11 18" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Back to log in
</a>

<button class="theme-toggle auth-theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
  </svg>
</button>

<div class="auth-page">
  <div class="auth-card auth-stepper">

    <div class="auth-head">
      <h1>Reset your password</h1>
      <p>Enter the email on your account and we'll send you a reset link.</p>
    </div>

    <form data-forgot-form novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <button type="submit" class="btn btn--primary">Send reset link</button>
    </form>

    <div class="auth-status" data-forgot-status hidden>
      <div class="auth-status__icon c-teal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4H20V20H4V4Z" stroke-linejoin="round"/><path d="M4 6L12 13L20 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h2>Check your inbox</h2>
      <p>If an account exists for <span data-forgot-email></span>, we've sent a link to reset the password.</p>
    </div>

    <p class="auth-foot">Remembered it? <a href="login.html">Log in</a></p>
  </div>
</div>

<script type="module" src="../../js/auth/forgotPassword.js"></script>
</body>
</html>
