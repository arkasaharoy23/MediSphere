<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — PulseLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../../public/assets/images/logo.svg">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/pages/auth.css">
</head>
<body>

<a href="../index.html" class="auth-back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6L5 12L11 18" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Back to PulseLink
</a>

<button class="theme-toggle auth-theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>
  </svg>
</button>

<div class="auth-page">
  <div class="auth-card auth-split">

    <div class="auth-split__aside">
      <div>
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14.5" stroke="var(--color-on-navy)" stroke-width="1.75"/>
          <path d="M6 16H11L13.5 9L18.5 23L21 16H26" stroke="var(--color-teal)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="13.5" cy="9" r="1.75" fill="var(--color-coral)"/>
        </svg>
        <h2>Welcome back to PulseLink</h2>
        <p>Log in to reach your dashboard, whether you're a patient or part of a care team.</p>
      </div>
      <p>Encrypted end to end. Role-based access, always.</p>
    </div>

    <div class="auth-split__form">
      <div class="auth-head">
        <h1 data-login-heading>Log in</h1>
        <p data-login-subtext>Enter your details to continue.</p>
      </div>

      <form data-login-form novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-field password-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
          <button type="button" class="password-toggle" data-password-toggle aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12S5 5 12 5S22 12 22 12S19 19 12 19S2 12 2 12Z" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div class="auth-step-actions" data-hide-in-admin-mode>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--primary">Log in</button>
      </form>

      <div data-hide-in-admin-mode>
        <div class="divider">or</div>

        <button type="button" class="btn btn--google" data-google-btn>
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.5 12.2c0-.8-.07-1.5-.2-2.2H12v4.2h5.9c-.25 1.3-1 2.5-2.2 3.2v2.6h3.5c2-1.9 3.3-4.7 3.3-7.8z"/><path fill="#34A853" d="M12 23c3 0 5.4-1 7.2-2.7l-3.5-2.6c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.2v2.7C4 20.9 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.8 14.3c-.2-.7-.4-1.4-.4-2.3s.15-1.5.4-2.3V7H2.2C1.4 8.5 1 10.2 1 12s.4 3.5 1.2 5l3.6-2.7z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3 .55 4.2 1.6l3.1-3.1C17.4 2.1 15 1 12 1 7.7 1 4 3.1 2.2 7l3.6 2.7c.9-2.6 3.3-4.3 6.2-4.3z"/></svg>
          Continue with Google
        </button>
      </div>

      <p class="auth-foot" data-hide-in-admin-mode>New to PulseLink? <a href="register.html">Create an account</a></p>

      <div class="admin-toggle">
        <button type="button" data-admin-toggle-btn>Are you an administrator? Log in as admin</button>
      </div>
    </div>

  </div>
</div>

<script type="module" src="../../js/auth/login.js"></script>
</body>
</html>
