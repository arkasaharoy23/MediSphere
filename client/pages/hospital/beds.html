<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bed Availability — MediSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../../public/assets/images/logo.svg">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/layout/sidebar.css">
<link rel="stylesheet" href="../../css/pages/dashboard.css">
<link rel="stylesheet" href="../../css/pages/hospital.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" data-sidebar>
    <div class="sidebar__brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14.5" stroke="var(--color-on-navy)" stroke-width="1.75"/>
        <path d="M6 16H11L13.5 9L18.5 23L21 16H26" stroke="var(--color-teal)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="13.5" cy="9" r="1.75" fill="var(--color-coral)"/>
      </svg>
      MediSphere
    </div>

    <nav class="sidebar__nav">
      <a href="dashboard.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        Dashboard
      </a>
      <a href="departments.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V6L12 3L20 6V21" stroke-linejoin="round"/><path d="M9 21V14H15V21" stroke-linejoin="round"/></svg>
        Departments
      </a>
      <a href="doctors.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3V8C9 10 7 11 7 13C7 16 9.5 18 12 18C14.5 18 17 16 17 13C17 11 15 10 15 8V3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="6" r="2"/></svg>
        Doctors
      </a>
      <a href="appointments.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3V7M16 3V7M3 10H21" stroke-linecap="round"/></svg>
        Appointments
      </a>
      <a href="beds.html" class="sidebar__link" data-active="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 19V9C3 8 3.5 7.5 4.5 7.5H19.5C20.5 7.5 21 8 21 9V19" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 15H21" stroke-linecap="round"/><path d="M7 15V12H11V15" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Bed Availability
      </a>
    </nav>

    <button class="sidebar__logout" data-logout-btn>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H9" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17L21 12L16 7" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke-linecap="round"/></svg>
      Log out
    </button>
  </aside>

  <div class="app-main">

    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6H20M4 12H20M4 18H20" stroke-linecap="round"/></svg>
        </button>
        <span class="topbar__title">Bed Availability</span>
      </div>

      <div class="topbar__actions">
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <div class="topbar__avatar" data-topbar-avatar></div>
      </div>
    </header>

    <main class="app-content">

      <div class="dash-welcome">
        <h1>Bed availability</h1>
        <p data-user-name>Loading...</p>
      </div>

      <div class="dash-banner" data-status-banner>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12L11 14L15 10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9"/></svg>
        <span data-status-text>Checking your account status...</span>
      </div>

      <div class="form-card">
        <h2 class="form-card__heading">Add a bed category</h2>

        <form data-add-bed-form novalidate>
          <div class="form-row--3">
            <div class="form-field">
              <label for="bedCategory">Category</label>
              <input type="text" id="bedCategory" name="category" placeholder="e.g. ICU, General" required>
            </div>

            <div class="form-field">
              <label for="bedTotal">Total beds</label>
              <input type="number" id="bedTotal" name="total" min="0" required>
            </div>

            <div class="form-field">
              <label for="bedAvailable">Currently available</label>
              <input type="number" id="bedAvailable" name="available" min="0" required>
            </div>
          </div>

          <div class="form-field">
            <label for="bedDepartment">Department (optional)</label>
            <select id="bedDepartment" name="departmentId">
              <option value="">Not linked to a department</option>
            </select>
          </div>

          <button type="submit" class="btn btn--primary">Add category</button>
        </form>
      </div>

      <div class="hosp-list" data-bed-list>
        <p class="hosp-empty">Loading...</p>
      </div>

    </main>
  </div>
</div>

<script type="module" src="../../js/hospital/beds.js"></script>
</body>
</html>
