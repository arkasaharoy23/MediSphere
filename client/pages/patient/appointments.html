<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointments — MediSphere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../../public/assets/images/logo.svg">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/layout/sidebar.css">
<link rel="stylesheet" href="../../css/pages/dashboard.css">
<link rel="stylesheet" href="../../css/pages/appointment.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" data-sidebar>
    <div class="sidebar__brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14.5" stroke="var(--color-on-navy)" stroke-width="1.75"/>
        <path d="M6 16H11L13.5 9L18.5 23L21 16H26" stroke="var(--color-teal)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="13.5" cy="9" r="1.75" fill="var(--color-coral)"/>
      </svg>
      MediSphere
    </div>

    <nav class="sidebar__nav">
      <a href="dashboard.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        Dashboard
      </a>
      <a href="appointments.html" class="sidebar__link" data-active="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3V7M16 3V7M3 10H21" stroke-linecap="round"/></svg>
        Appointments
      </a>
      <a href="medical-records.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H15M10 3V9L5 18C4.5 19 5 20 6.5 20H17.5C19 20 19.5 19 19 18L14 9V3" stroke-linejoin="round"/></svg>
        Medical Records
      </a>
      <a href="emergency.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L15 9L22 10L17 15L18 22L12 18.5L6 22L7 15L2 10L9 9L12 2Z" stroke-linejoin="round"/></svg>
        Emergency SOS
      </a>
      <a href="lab-tests.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2V8L4 18C3.5 19.5 4.5 21 6 21H18C19.5 21 20.5 19.5 20 18L15 8V2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 2H15" stroke-linecap="round"/><path d="M7 14H17" stroke-linecap="round"/></svg>
        Lab Tests
      </a>
      <a href="profile.html" class="sidebar__link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21C4 16.5 7.5 14 12 14C16.5 14 20 16.5 20 21" stroke-linecap="round"/></svg>
        Profile
      </a>
    </nav>

    <button class="sidebar__logout" data-logout-btn>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H9" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17L21 12L16 7" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke-linecap="round"/></svg>
      Log out
    </button>
  </aside>

  <div class="app-main">

    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6H20M4 12H20M4 18H20" stroke-linecap="round"/></svg>
        </button>
        <span class="topbar__title">Appointments</span>
      </div>

      <div class="topbar__actions">
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
        <a href="profile.html" class="topbar__avatar" data-topbar-avatar aria-label="View profile"></a>
      </div>
    </header>

    <main class="app-content">

      <div class="dash-welcome">
        <h1>Appointments</h1>
        <p data-user-name>Loading...</p>
      </div>

      <div class="dash-banner" data-status-banner>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12L11 14L15 10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9"/></svg>
        <span data-status-text>Checking your account status...</span>
      </div>

      <div class="appt-section">
        <h2>Book a new appointment</h2>
        <div class="form-card">
          <form data-booking-form novalidate>

            <div class="form-row">
              <div class="form-field">
                <label for="radius">Search radius</label>
                <select id="radius" data-radius-select>
                  <option value="10">Within 10 km</option>
                  <option value="25" selected>Within 25 km</option>
                  <option value="50">Within 50 km</option>
                  <option value="100">Within 100 km</option>
                  <option value="all">Show all doctors</option>
                </select>
              </div>

              <div class="form-field">
                <label for="doctorId">Doctor</label>
                <select id="doctorId" name="doctorId" data-doctor-select required>
                  <option value="">Loading doctors...</option>
                </select>
              </div>
            </div>

            <small data-location-note>Detecting your location to find nearby doctors...</small>

            <div class="form-field" data-visit-location-field hidden>
              <label for="visitLocation">Where would you like to visit?</label>
              <select id="visitLocation" name="visitLocation">
                <option value="clinic">See the doctor personally (at their clinic)</option>
                <option value="hospital" data-hospital-option>Visit at the hospital</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label for="date">Preferred date</label>
                <input type="date" id="date" name="date" required>
              </div>

              <div class="form-field">
                <label for="timeSlot">Preferred time</label>
                <input type="text" id="timeSlot" name="timeSlot" placeholder="e.g. 10:00 AM" required>
              </div>
            </div>

            <div class="form-field">
              <label for="reason">Reason for visit (optional)</label>
              <textarea id="reason" name="reason" placeholder="Briefly describe why you're booking this appointment"></textarea>
            </div>

            <button type="submit" class="btn btn--primary">Book appointment</button>
          </form>
        </div>
      </div>

      <div class="appt-section" data-appt-section hidden>
        <h2>Your appointments</h2>
        <div class="appt-list" data-appt-list></div>
      </div>

    </main>
  </div>
</div>

<script type="module" src="../../js/patient/appointments.js"></script>
</body>
</html>
